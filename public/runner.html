<!doctype html>
<!-- Runs the code of runnable code blocks. Always embedded with sandbox="allow-scripts" (opaque origin: no access to the app, its
     storage or cookies); eval is allowed here only, the code itself runs in a worker without network -->
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src blob:; connect-src 'none'">
<title>Slidecko code runner</title>
<script src="runner.js"></script>
