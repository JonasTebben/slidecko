# A tag v… (set by the deployment when a version goes live) becomes a GitHub release whose notes are the commits since
# the previous release
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notes from the commits since the last release
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          # the first release lists the last 30 commits
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="-30 $GITHUB_REF_NAME"; fi
          git log --no-merges --format='- %s' $range > notes.md
          # an existing release only gets its notes written
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md; fi
        env:
          GH_TOKEN: ${{ github.token }}
