# Every push and pull request: unit tests, the production build (compiles the .vue files) and the browser smoke test
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test
      # tests must not depend on the order they run in (it differs between macOS and Linux): three shuffled runs
      - name: bun test in random order
        run: for seed in 1 2 3; do bun test --randomize --seed=$seed > /dev/null 2>&1 || { bun test --randomize --seed=$seed; exit 1; }; done
      - run: bun run build
      - name: Chromium for the smoke test
        run: bunx playwright install --with-deps chromium
      # the runner is slower than a laptop, so a touch or layout step can miss its moment: one more try,
      # flagged as a warning so a flaky step gets fixed instead of hidden
      - name: bun run smoke
        run: |
          bun run smoke && exit 0
          echo "::warning title=Smoke flaky::the smoke test failed once and is run again; see the first run above"
          bun run smoke
      - name: Screenshots of failed smoke steps
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke
          path: .smoke-tmp/*.png
          if-no-files-found: ignore
          include-hidden-files: true # .smoke-tmp
